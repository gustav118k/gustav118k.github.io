<!DOCTYPE html>

    <title>Find Penguins</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        #bucketlist ul {
            list-style-type: none;
            padding-left: 0;
        }
        #bucketlist li {
            margin-bottom: 8px;
        }
        /* Make the labels look like normal text since they are no longer clickable */
        #bucketlist label {
            cursor: default;
            color: inherit; 
        }
        /* Optional: Makes the disabled checkboxes look a bit more solid */
        #bucketlist input[type="checkbox"]:disabled {
            opacity: 0.8;
        }
    </style>
</head>

    <header class="site-header">

        <!-- Bucket List -->
        <section id="bucketlist">
            <h3>Bucket list</h3>
            <ul>
                <li><label><input type="checkbox" disabled> See a glacier</label></li>
                <li><label><input type="checkbox" disabled> Hike on top of a summit</label></li>
                <li><label><input type="checkbox" disabled> (Learn some Norwegian)</label></li>

                <li><label><input type="checkbox" disabled> Take a swim in the ocean</label></li>
